<div class="chip" id="c0"></div><div class="chip" id="c1"></div><div class="chip" id="c2"></div><div class="chip" id="c3"></div>
<div id="status"><div id="say"></div><div id="watch"></div></div>

<script type="module">
/* ═══ LUDO RACE · a Multiplayer Agent starter ═════════════════════════════════════════════
 * Roll the die, race four tokens around the board and home. Turn-based, 2–4 players; bots
 * take the empty colors, so one person alone still gets a full four-color game.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the rules (tokens, the roll that leaves the yard, extra turns), timings,
 *                   colors, the leaderboard
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   BOARD ......... the 15×15 grid: the 52-square track, home columns, yards, safe squares
 *   RULES ......... legal moves, what a move does (captures, getting home)
 *   BOT ........... how a bot picks a token: knock someone back, run from danger, get home
 *   GAME (HOST) ... seats, rolling, moving, bot turns, the turn timer, the winner.
 *                   Only the host writes the shared `game` field.
 *   SCENE ......... renderer, lights, the painted board, the table
 *   TOKENS & DIE .. token models, hopping square by square, knock-backs, the die, sparks, sounds
 *   MY TURN ....... can I roll or move, sending a roll or a move
 *   HUD & RESULTS . the four player chips, the status line, the results card, leaderboard
 *   INPUT / LOOP .. clicks, taps and keys, the camera, the main loop
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The whole game lives in ONE shared field, `game`: {id, v, seats, tok, turn, phase, die,
 *     t, r, at, rollAt, sixes, burnt, extra, mv, win, endsAt}. `seats` holds four sessionIds
 *     or "bot" (red, green, yellow, blue); `tok` holds each color's four tokens as progress
 *     (-1 yard, 0–50 the track, 51–55 the home column, 56 home). Only the HOST writes it and
 *     `v` goes up on every write.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It rolls the die (so nobody can pick their number), checks every
 *     move, plays the bots and an idle player's turn, and ends the game. A new host carries on
 *     from `game`: the timers are timestamps in it, so nothing freezes or restarts.
 *   - Each player writes its OWN entity: `n` (name), `c` (color), `hb` (heartbeat).
 *   - Players send intents to the host: "roll" {g, t}, "move" {g, t, k}, "again" {g}. `t`
 *     counts every roll and move, so a late or doubled intent is ignored. The host never
 *     gets its own sends, so it applies its own roll and moves directly.
 *   - Everyone animates from `mv` (the last move: who, which token, from, to, who it knocked
 *     back) and `r` (counts rolls: a new value throws the die).
 *   - Players take seats as they arrive; anyone past four watches. A seat silent for 10s goes
 *     to a bot, and a waiting player takes a bot's seat, even mid-game.
 *   - ?attract plays offline, four bots in a busy mid-game (the preview video is recorded from it).
 *   - Leaderboard "wins": +1 for each game a player wins, shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  tokens: 4,            // tokens per color (1 to 4)
  startOut: 2,          // tokens that start on the start square (the rest wait in the yard)
  exitRoll: 6,          // the roll that brings a token out of the yard
  maxSixes: 3,          // this many sixes in a row and the turn is lost
  autoMove: true,       // only one token can move? it moves by itself
  botRollMs: 700,       // a bot waits this long before it rolls
  botMoveMs: 520,       // ...and this long after the die lands before it moves
  rollMs: 760,          // the die tumbles this long
  passMs: 950,          // no move possible: the turn passes after this
  hopMs: 125,           // one square of a token's hop
  knockMs: 650,         // a knocked-back token flies home this long
  settleMs: 200,        // a short pause after each move before the next roll
  turnMs: 20000,        // a player who waits this long to roll or move gets a bot's move
  seatGraceMs: 10000,   // a seated player silent this long loses the seat to a bot
  resultsMs: 40000,     // results show this long, then a new game starts (Play again starts it at once)
  botNoise: 18,         // random wobble in a bot's choice (bigger = sillier)
  board: "wins",        // leaderboard name
  seatColors: ["#e8505b", "#2fb36d", "#f2b632", "#3a86ff"], // red, green, yellow, blue
  seatNames: ["Red", "Green", "Yellow", "Blue"],
  botNames: ["Ruby", "Fern", "Sunny", "Skye"],
  cream: "#fbf3e2", line: "#d8c9a8", frame: "#6b4429", sky: "#1d2338",
};
const COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#b197fc", "#ff922b", "#f783ac", "#3bc9db"];
const NAME_A = ["Lucky", "Speedy", "Bold", "Sunny", "Jolly", "Zippy"], NAME_B = ["Racer", "Roller", "Dasher", "Runner", "Hopper"];
const SEAT_PICK = [0, 2, 1, 3]; // the second player sits across from the first

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'ludo-race',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
/** Still in the room and heard from within the seat grace time (a backgrounded phone keeps its seat). */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── BOARD ───────────────────────────────────────────────────────────────────────────
// Board points are (x, y) on a 15×15 grid, y = 0 at the top (red's side); a square (c, r) has its
// centre at (c + 0.5, r + 0.5). Red's corner is drawn once and turned 90° for each next color.
const N = 15, LAP = 52, HOME_IN = 51, FINISH = 56; // progress: -1 yard, 0–50 track, 51–55 home column, 56 home
/** The 52 track squares, clockwise from red's start square. */
const TRACK = (() => {
  const t = [], add = (c, r) => t.push([c, r]);
  for (let c = 1; c <= 5; c++) add(c, 6);
  for (let r = 5; r >= 0; r--) add(6, r);
  add(7, 0);
  for (let r = 0; r <= 5; r++) add(8, r);
  for (let c = 9; c <= 14; c++) add(c, 6);
  add(14, 7);
  for (let c = 14; c >= 9; c--) add(c, 8);
  for (let r = 9; r <= 14; r++) add(8, r);
  add(7, 14);
  for (let r = 14; r >= 9; r--) add(6, r);
  for (let c = 5; c >= 0; c--) add(c, 8);
  add(0, 7); add(0, 6);
  return t;
})();
const START = (s) => 13 * s;                                              // seat s enters the track here
const SAFE = new Set([0, 1, 2, 3].flatMap((s) => [START(s), START(s) + 8])); // nobody is knocked back on these
const trackIndex = (s, p) => (START(s) + p) % LAP;
/** Turn a board point 90° clockwise n times (red's corner → green's → yellow's → blue's). */
const turnCW = ([x, y], n) => { for (let i = 0; i < ((n % 4) + 4) % 4; i++) [x, y] = [N - y, x]; return [x, y]; };
const YARD_SPOTS = [[1.85, 1.85], [4.15, 1.85], [1.85, 4.15], [4.15, 4.15]]; // red's yard; the die lands at its centre
const YARD_CENTER = [3, 3];
const FINISH_SPOTS = [[6.35, 7.0], [6.35, 8.0], [6.85, 7.25], [6.85, 7.75]]; // inside red's home triangle
/** Where seat s's token k stands at progress p, as a board point. */
function spotOf(s, p, k) {
  if (p < 0) return turnCW(YARD_SPOTS[k], s);
  if (p <= 50) { const [c, r] = TRACK[trackIndex(s, p)]; return [c + 0.5, r + 0.5]; }
  if (p < FINISH) return turnCW([p - 50 + 0.5, 7.5], s);
  return turnCW(FINISH_SPOTS[k], s);
}
const worldOf = ([x, y], h = 0) => new THREE.Vector3(x - N / 2, h, y - N / 2);

// ── RULES ───────────────────────────────────────────────────────────────────────────
/** The moves seat s has with this die: [{k, a, b}] (token, from, to), one per square (tokens sharing a square move the same). */
function legalMoves(g, s = g.turn, die = g.die) {
  if (g.burnt) return [];
  const out = [], seen = new Set();
  g.tok[s].forEach((p, k) => {
    const b = p < 0 ? (die === CONFIG.exitRoll ? 0 : -1) : p + die;
    if (b < 0 || p === FINISH || b > FINISH || seen.has(p)) return; // home needs the exact roll
    seen.add(p); out.push({ k, a: p, b });
  });
  return out;
}
/** Rival tokens on track square idx: [[seat, k]]. */
function rivalsAt(tok, s, idx) {
  const out = [];
  tok.forEach((t, o) => { if (o !== s) t.forEach((p, k) => { if (p >= 0 && p <= 50 && trackIndex(o, p) === idx) out.push([o, k]); }); });
  return out;
}
/** What a move does: the new tokens, who it knocks back ([seat, k, their progress]), and whether it gets home or wins. */
function moveResult(g, m) {
  const s = g.turn, tok = g.tok.map((t) => t.slice()), cap = [];
  tok[s][m.k] = m.b;
  if (m.b <= 50) {
    const idx = trackIndex(s, m.b);
    if (!SAFE.has(idx)) for (const [o, k] of rivalsAt(tok, s, idx)) { cap.push([o, k, tok[o][k]]); tok[o][k] = -1; }
  }
  return { tok, cap, home: m.b === FINISH, done: tok[s].every((p) => p === FINISH) };
}

// ── BOT ─────────────────────────────────────────────────────────────────────────────
/** Could a rival land on seat s's token at progress p with one roll? */
function threat(tok, s, p) {
  if (p < 0 || p > 50) return false;
  const idx = trackIndex(s, p);
  if (SAFE.has(idx)) return false;
  for (let o = 0; o < 4; o++) {
    if (o === s) continue;
    for (const q of tok[o]) {
      if (q < 0 || q > 50) continue;
      const d = (idx - trackIndex(o, q) + LAP) % LAP;
      if (d >= 1 && d <= 6 && q + d <= 50) return true;
    }
  }
  return false;
}
/** Score every legal move and take the best: knock someone back, get home, leave the yard, stay safe. */
function botPick(g, legal) {
  const s = g.turn;
  let best = legal[0], top = -Infinity;
  for (const m of legal) {
    const r = moveResult(g, m);
    let v = Math.random() * CONFIG.botNoise + m.b * 0.08;
    if (r.cap.length) v += 70 + r.cap.reduce((n, c) => n + c[2], 0) * 0.6;
    if (r.home) v += 55;
    if (m.a < 0) v += 45;
    if (m.b >= HOME_IN && m.a < HOME_IN) v += 28;                       // into the home column: safe for good
    if (m.b <= 50 && SAFE.has(trackIndex(s, m.b))) v += 14;
    if (threat(g.tok, s, m.a)) v += 22 + m.a * 0.3;                      // run from danger
    if (threat(r.tok, s, m.b)) v -= 26 + m.b * 0.3;                      // don't step into it
    if (v > top) { top = v; best = m; }
  }
  return best;
}

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null };
const gameMemo = { raw: undefined, g: null };
/** The game as state has it, or the host's own newer write that hasn't come back yet. */
function game() {
  if (gameMemo.raw !== S.shared.game) { gameMemo.raw = S.shared.game; gameMemo.g = parse(S.shared.game, null); }
  const g = gameMemo.g;
  return host.last && isHost() && (!g || host.last.v > g.v) ? host.last : g;
}
function writeGame(g) { g = { ...g, v: (game()?.v ?? 0) + 1 }; host.last = g; net.setShared("game", JSON.stringify(g)); return g; }
// ?attract starts mid-race, tokens close together, so the preview shows hops and knock-backs at once.
const ATTRACT_TOKENS = [[4, 17, 30, -1], [9, 22, 44, 52], [2, 15, 35, -1], [11, 27, 40, 53]];
function startTokens() {
  if (ATTRACT) return ATTRACT_TOKENS.map((t) => t.slice(0, CONFIG.tokens));
  return [0, 1, 2, 3].map(() => Array.from({ length: CONFIG.tokens }, (_, k) => (k < CONFIG.startOut ? 0 : -1)));
}
const freshGame = (id, seats) => ({ id, seats, tok: startTokens(), turn: (id - 1) % 4, phase: "roll", die: 0, t: 0, r: 0, at: Date.now() + 1200,
  rollAt: 0, sixes: 0, burnt: 0, extra: "", mv: { n: 0 }, win: -1, endsAt: 0 });

/** Gone players lose their seat to a bot; waiting players take a bot's seat (even mid-game). */
function fixSeats(g) {
  if (ATTRACT) return g;
  const seats = g.seats.slice(), waiting = livePlayers().filter((id) => !seats.includes(id));
  for (let s = 0; s < 4; s++) if (seats[s] !== "bot" && !stillHere(seats[s])) seats[s] = "bot";
  for (const s of SEAT_PICK) if (seats[s] === "bot" && waiting.length) seats[s] = waiting.shift();
  if (seats.every((x, s) => x === g.seats[s])) return g;
  const out = { ...g, seats };
  if (seats[g.turn] !== g.seats[g.turn]) { if (g.phase === "roll") out.at = Date.now(); else out.rollAt = Date.now() - CONFIG.rollMs; } // a full turn for the newcomer
  return writeGame(out);
}
function doRoll(g) {
  const die = 1 + Math.floor(Math.random() * 6), sixes = die === 6 ? g.sixes + 1 : 0;
  return writeGame({ ...g, phase: "move", die, sixes, burnt: sixes >= CONFIG.maxSixes ? 1 : 0, t: g.t + 1, r: g.r + 1, rollAt: Date.now() });
}
/** Apply a checked move: knock rivals back, maybe win, then the same color rolls again (six, knock-back, home) or the next one does. */
function doMove(g, m) {
  const s = g.turn, r = moveResult(g, m), now = Date.now();
  const steps = m.a < 0 ? 1 : m.b - m.a;
  const animMs = steps * CONFIG.hopMs + (r.cap.length ? CONFIG.knockMs : 0) + CONFIG.settleMs;
  const out = { ...g, tok: r.tok, t: g.t + 1, mv: { n: g.mv.n + 1, s, k: m.k, a: m.a, b: m.b, cap: r.cap } };
  if (r.done) return writeGame({ ...out, phase: "over", win: s, at: now, endsAt: now + animMs + CONFIG.resultsMs });
  const again = g.die === 6 || r.cap.length > 0 || r.home;
  return writeGame({ ...out, phase: "roll", turn: again ? s : (s + 1) % 4, sixes: again ? g.sixes : 0, burnt: 0, at: now + animMs,
    extra: !again ? "" : r.cap.length ? "cap" : r.home ? "home" : "six" });
}
const passTurn = (g) => writeGame({ ...g, phase: "roll", turn: (g.turn + 1) % 4, sixes: 0, burnt: 0, t: g.t + 1, at: Date.now(), extra: "" });

/** A "roll" intent (or the host's own roll): only from the seat whose turn it is, on this exact step. */
function hostRoll(from, m) {
  const g = game();
  if (g && g.phase === "roll" && m.g === g.id && m.t === g.t && g.seats[g.turn] === from) doRoll(g);
}
/** A "move" intent: token k of the mover's color, checked against the rules. */
function hostMove(from, m) {
  const g = game();
  if (!g || g.phase !== "move" || m.g !== g.id || m.t !== g.t || g.seats[g.turn] !== from) return;
  const p = g.tok[g.turn][m.k], mv = legalMoves(g).find((x) => x.a === p);
  if (mv) doMove(g, { ...mv, k: m.k });
}
/** Play again: a new game, same seats. */
function hostAgain(from, m) {
  const g = game();
  if (g && g.phase === "over" && m.g === g.id && g.seats.includes(from)) writeGame(freshGame(g.id + 1, g.seats));
}

  if (opts.length) dots.material.color.set(CONFIG.seatColors[g.turn]);
  return new Set(opts.map((o) => o.v));
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const nameOf = (g, s) => { const id = g.seats[s]; return id === "bot" ? CONFIG.botNames[s] + " Bot" : id === net.sessionId ? myName : String(S.entities.players[id]?.n || "Player").slice(0, 16); };
const colorOfPlayer = (id) => (id === net.sessionId ? myColor : S.entities.players[id]?.c || "#ccc");
const homeCount = (g, s) => g.tok[s].filter((p) => p === FINISH).length;
let toastAt = 0, dropped = false, resultsFor = -1, closedFor = -1, board = null, seatsSeen = null, turnSeen = "";
function toast(text) { $("toast").textContent = text; $("toast").style.opacity = 1; toastAt = performance.now(); }
/** One player chip, in the corner nearest that color's yard as I see the board. */
function chip(el, s, g, corner) {
  const id = g.seats[s], turn = g.phase !== "over" && g.turn === s, col = CONFIG.seatColors[s], home = homeCount(g, s);
  const sub = (id === "bot" ? "bot · " : id === net.sessionId ? "you · " : "") + `${home}/${CONFIG.tokens} home`;
  const dot = id === "bot" ? "" : `<i class="dot" style="background:${esc(colorOfPlayer(id))}"></i>`;
  const html = `<span class="sw" style="background:${col}">${home}</span><span class="who"><span class="nm">${dot}${esc(nameOf(g, s))}</span><span class="sub">${sub}</span></span><i class="tm"></i>`;
  if (el.dataset.html !== html) { el.dataset.html = html; el.innerHTML = html; }
  el.className = `chip ${corner}${turn ? " turn" : ""}`; el.style.setProperty("--c", col);
  const ends = g.phase === "roll" ? g.at + CONFIG.turnMs : g.rollAt + CONFIG.rollMs + CONFIG.turnMs;
  el.lastChild.style.width = turn && id !== "bot" ? Math.max(0, Math.min(100, ((ends - Date.now()) / CONFIG.turnMs) * 100)) + "%" : "0";
}
function statusText(g, me) {
  const mine = me >= 0 && g.turn === me, who = nameOf(g, g.turn);
  if (g.phase === "over") return g.win === me ? "You win! All your tokens are home" : `${nameOf(g, g.win)} wins!`;
  if (g.phase === "roll") {
    const ex = { six: "Six! ", cap: "Knocked one back! ", home: "Home! " }[g.extra] || "";
    if (mine) return sentT ? "Rolling…" : ex + (ex ? "Roll again" : "Your turn") + (performance.now() < hintUntil ? " · tap to roll" : "");
    return ex + (ex ? `${who} rolls again` : `${who} is rolling…`);
  }
  if (dieRolling()) return mine ? "Rolling…" : `${who} is rolling…`;
  if (g.burnt) return `Three sixes in a row · ${mine ? "your" : who + "'s"} turn is over`;
  const legal = legalMoves(g);
  if (!legal.length) return `${mine ? "You" : who} rolled ${g.die} · no move`;
  if (mine) return `You rolled ${g.die} · ${legal.length === 1 && CONFIG.autoMove ? "moving…" : "tap a glowing token"}`;
  return `${who} rolled ${g.die}`;
}
function hud(g) {
  const now = performance.now(), me = mySeat(g), base = me >= 0 ? me : 3;
  if (now - toastAt > 2600) $("toast").style.opacity = 0;
  if (ATTRACT) { for (const id of ["c0", "c1", "c2", "c3", "status", "net", "toast"]) $(id).classList.add("hide"); return; }
  for (let s = 0; s < 4; s++) chip($("c" + s), s, g, ["bl", "tl", "tr", "br"][(s - base + 4) % 4]);
  // seat changes: someone took over from a bot, or a bot took over
  const prev = seatsSeen;
  seatsSeen = { id: g.id, seats: g.seats.slice() };
  if (prev && prev.id === g.id) for (let s = 0; s < 4; s++) if (prev.seats[s] !== g.seats[s]) toast(`${g.seats[s] === net.sessionId ? "You" : nameOf(g, s)} took over ${CONFIG.seatNames[s].toLowerCase()}`);
  const turnKey = g.id + ":" + g.turn + ":" + g.phase;
  if (turnKey !== turnSeen) { turnSeen = turnKey; if (g.phase === "roll" && g.turn === me) sound("turn"); }
  $("say").textContent = statusText(g, me) + (me < 0 && g.phase !== "over" ? " · you're watching" : "");
  const watchers = livePlayers().filter((id) => !g.seats.includes(id));
  $("watch").textContent = watchers.length ? "Watching: " + watchers.map((id) => (id === net.sessionId ? "you" : String(S.entities.players[id]?.n || "Player"))).join(", ") : "";
  // the big button: Roll on my turn, Play again after the game
  const btn = $("roll");
  btn.hidden = !(canRoll(g) || (g.phase === "over" && me >= 0 && closedFor === g.id));
  btn.textContent = g.phase === "over" ? "Play again" : "🎲 Roll";
  btn.classList.toggle("again", g.phase === "over");
  if (g.phase === "over" && resultsFor !== g.id && !busy()) showResults(g, me);
  $("over").hidden = g.phase !== "over" || resultsFor !== g.id || closedFor === g.id;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the game" : ""}`;
}
function showResults(g, me) {
  resultsFor = g.id;
  const won = me >= 0 && g.win === me;
  $("overTitle").textContent = won ? "You win!" : `${nameOf(g, g.win)} wins`;
  $("overWhy").textContent = `All ${CONFIG.tokens} ${CONFIG.seatNames[g.win].toLowerCase()} tokens made it home first.`;
  const order = [0, 1, 2, 3].sort((a, b) => (b === g.win) - (a === g.win) || homeCount(g, b) - homeCount(g, a) || g.tok[b].reduce((n, p) => n + p, 0) - g.tok[a].reduce((n, p) => n + p, 0));
  $("standings").innerHTML = order.map((s) => `<li><i class="sq" style="background:${CONFIG.seatColors[s]}"></i>${esc(nameOf(g, s))}${s === me ? " (you)" : ""}<span>${homeCount(g, s)}/${CONFIG.tokens} home</span></li>`).join("");
  $("again").classList.toggle("hide", me < 0);
  burst(worldOf([7.5, 7.5]), CONFIG.seatColors[g.win], 70, 5);
  sound(won ? "win" : "home");
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const g = game(); if (!g || g.phase !== "over") return; const msg = { g: g.id }; if (isHost()) hostAgain(net.sessionId, msg); else net.send("again", msg); }
$("again").onclick = playAgain;
$("look").onclick = () => { closedFor = game()?.id ?? -1; };
$("roll").onclick = () => { const g = game(); if (g && g.phase === "over") playAgain(); else sendRoll(); };

// ── INPUT / LOOP ────────────────────────────────────────────────────────────────────
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), floor = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
/** On my roll: a tap anywhere rolls. On my move: the token tapped, or the one nearest the tap (its square or where it would land). */
renderer.domElement.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const g = game(); if (!g) return;
  if (canRoll(g)) return sendRoll();
  const opts = myOptions(g); if (!opts.length) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(opts.map((o) => o.v.g), true);
  if (hits.length) return sendMove(hits[0].object.parent.userData.k);
  if (!ray.ray.intersectPlane(floor, hit)) return;
  let best = null, bd = 1.3;
  for (const o of opts) for (const at of [o.v.rest, worldOf(spotOf(g.turn, o.b, o.k))]) { const d = Math.hypot(at.x - hit.x, at.z - hit.z); if (d < bd) { bd = d; best = o; } }
  if (best) sendMove(best.k);
});
addEventListener("keydown", (e) => {
  const g = game(); if (!g) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (canRoll(g)) sendRoll(); else { const o = myOptions(g); if (o.length && new Set(o.map((x) => x.b)).size === 1) sendMove(o[0].k); } }
  if (e.key >= "1" && e.key <= "4") sendMove(+e.key - 1);
});
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

/** The camera sits behind your color (your yard nearest you, bottom left) and backs off until the board fits. */
const camAt = new THREE.Vector3(), camGoal = new THREE.Vector3();
let camAngle = 0;
function aimCamera(dt, g, now) {
  const portrait = innerHeight > innerWidth, elev = ATTRACT ? 0.92 : portrait ? 1.2 : 1.0, seat = g ? mySeat(g) : -1;
  const want = ATTRACT ? 0.6 + now / 16000 : ((3 - (seat < 0 ? 3 : seat)) * Math.PI) / 2;
  camAngle += Math.atan2(Math.sin(want - camAngle), Math.cos(want - camAngle)) * Math.min(1, dt * (ATTRACT ? 10 : 3));
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect), B = 8.05;
  const room = Math.max(0.45, 1 - 2 * (portrait ? 150 : 64) / innerHeight);
  const dist = ATTRACT ? 16.5 : Math.max(B / Math.tan(hf * 0.97) + B * Math.cos(elev), (B * Math.sin(elev)) / Math.tan(vf * room) + B * Math.cos(elev));
  scene.fog.near = dist * 1.1; scene.fog.far = dist * 2.6;
  camGoal.set(Math.sin(camAngle) * Math.cos(elev) * dist, Math.sin(elev) * dist, Math.cos(camAngle) * Math.cos(elev) * dist);
  if (!camAt.lengthSq()) camAt.copy(camGoal);
  camAt.lerp(camGoal, Math.min(1, dt * 4));
  camera.position.copy(camAt); camera.lookAt(0, ATTRACT ? -0.9 : 0, 0);
}

let myName = "", myColor = COLORS[0], last = performance.now(), lastHb = 0, lastHud = 0;
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
const pickOne = (list) => list[Math.floor(Math.random() * list.length)];
if (!myName) { myName = pickOne(NAME_A) + " " + pickOne(NAME_B); try { localStorage.setItem("mpa-name", myName); } catch {} }
if (ATTRACT) { Object.assign(CONFIG, { botRollMs: 240, botMoveMs: 170, rollMs: 520, passMs: 360, hopMs: 80, resultsMs: 2500, botNoise: 8 }); $("net").textContent = ""; }
/** Two people joined at once with one color: the one with the higher sessionId picks a free one. (Bots show their seat color, never these.) */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c)), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the board meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick();
  const g = game();
  let lift = new Set();
  if (g) {
    if (sentT && (sentT !== g.id + ":" + g.t || now - sentAt > 4000)) sentT = ""; // answered, or lost in a host change: let me act again
    syncTokens(g, now); syncDie(g, now);
    lift = markOptions(g, now);
    if (now - lastHud > 100) { lastHud = now; hud(g); }
  }
  tickTokens(now, dt, lift);
  tickDie(now, dt, !!g && canRoll(g));
  tickSparks(dt);
  aimCamera(dt, g, now);
  renderer.render(scene, camera);
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("roll", (m, from) => { if (isHost() && m) hostRoll(from, m); });
  net.on("move", (m, from) => { if (isHost() && m) hostMove(from, m); });
  net.on("again", (m, from) => { if (isHost() && m) hostAgain(from, m); });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const takenColors = new Set(Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c));
  myColor = COLORS.find((c) => !takenColors.has(c)) || pickOne(COLORS);
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  requestAnimationFrame(frame);
})();
</script>
